services:
  mysql:
    image: mysql:8.0
    container_name: ventagram-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ventagram
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ventagram-web:
    build:
      context: ./Ventagram.Web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ventagram-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${VENTAGRAM_WEB_PORT:-7048}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ventagram-web.rule=Host(`ventagram.com.ar`) || Host(`www.ventagram.com.ar`)"
      - "traefik.http.routers.ventagram-web.entrypoints=websecure"
      - "traefik.http.routers.ventagram-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.ventagram-web.loadbalancer.server.port=8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;database=ventagram;user=root;password=${MYSQL_ROOT_PASSWORD};
      DataProtection__KeysPath: /keys/dataprotection
      Authentication__CookieDomain: ${VENTAGRAM_COOKIE_DOMAIN:-.ventagram.com.ar}
      Authentication__SharedApplicationName: Ventagram
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Use the current browser origin; Traefik routes /api/chat and /hubs/chat.
      Chat__BaseUrl: ""
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromEmail: ${SMTP_FROM_EMAIL}
      Email__ContactRecipient: ${SMTP_CONTACT_RECIPIENT:-${SMTP_FROM_EMAIL}}
      Email__FromName: ${SMTP_FROM_NAME:-Ventagram}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-25}
      Map__StyleUrl: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      Map__TilesUrlTemplate: ${MAP_TILES_URL_TEMPLATE:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      Map__AttributionHtml: ${MAP_ATTRIBUTION_HTML:-&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors}
      Map__GeocodingSearchUrlTemplate: ${MAP_GEOCODING_SEARCH_URL_TEMPLATE}
      Map__ReverseGeocodingUrlTemplate: ${MAP_REVERSE_GEOCODING_URL_TEMPLATE}
      Cloudflare__R2__AccountId: ${R2_ACCOUNT_ID}
      Cloudflare__R2__ServiceUrl: ${R2_SERVICE_URL}
      Cloudflare__R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      Cloudflare__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      Cloudflare__R2__Bucket: ${R2_BUCKET}
      Cloudflare__R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL}
      Cloudflare__R2__Prefix: ${R2_PREFIX:-publications}
      Cloudflare__R2__Region: ${R2_REGION:-auto}
      Cloudflare__R2__MaxImageSide: ${R2_MAX_IMAGE_SIDE:-1600}
      Cloudflare__R2__WebpQuality: ${R2_WEBP_QUALITY:-82}
      Cloudflare__R2__WatermarkScale: ${R2_WATERMARK_SCALE:-0.14}
      Cloudflare__R2__WatermarkOpacity: ${R2_WATERMARK_OPACITY:-0.45}
      Cloudflare__R2__MaxVideoBytes: ${R2_MAX_VIDEO_BYTES:-83886080}
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-false}
      Database__RunSeedDataOnStartup: ${DATABASE_RUN_SEED_DATA_ON_STARTUP:-false}
    volumes:
      - dataprotection_keys:/keys/dataprotection

  ventagram-chat:
    build:
      context: ./Ventagram.ChatService
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ventagram-chat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${VENTAGRAM_CHAT_PORT:-7065}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ventagram-chat.rule=(Host(`ventagram.com.ar`) || Host(`www.ventagram.com.ar`)) && (PathPrefix(`/api/chat`) || PathPrefix(`/hubs/chat`))"
      - "traefik.http.routers.ventagram-chat.entrypoints=websecure"
      - "traefik.http.routers.ventagram-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ventagram-chat.priority=100"
      - "traefik.http.services.ventagram-chat.loadbalancer.server.port=8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      ConnectionStrings__VentagramConnection: server=mysql;port=3306;database=ventagram;user=root;password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__ChatConnection: server=mysql;port=3306;database=ventagram_chat;user=root;password=${MYSQL_ROOT_PASSWORD};
      DataProtection__KeysPath: /keys/dataprotection
      Authentication__CookieDomain: ${VENTAGRAM_COOKIE_DOMAIN:-.ventagram.com.ar}
      Authentication__CookieName: .Ventagram.Auth.v2
      Authentication__LoginPath: /Account/Login
      Authentication__LogoutPath: /Account/Logout
      Authentication__AccessDeniedPath: /Account/Login
      Authentication__SharedApplicationName: Ventagram
      Cors__AllowedOrigins__0: ${VENTAGRAM_WEB_BASE_URL:-https://ventagram.com.ar}
      Cors__AllowedOrigins__1: ${VENTAGRAM_WEB_BASE_URL_ALT:-}
      Chat__PublicBaseUrl: ${VENTAGRAM_WEB_BASE_URL:-https://ventagram.com.ar}
      Chat__PublicationBaseUrl: ${VENTAGRAM_WEB_BASE_URL:-https://ventagram.com.ar}
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromEmail: ${SMTP_FROM_EMAIL}
      Email__FromName: ${SMTP_FROM_NAME:-Ventagram}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-25}
    volumes:
      - dataprotection_keys:/keys/dataprotection

volumes:
  mysql_data:
  dataprotection_keys:
