services:
  ventamap-mysql:
    image: mysql:8.0
    container_name: ventamap-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${VENTAMAP_DATABASE_NAME:-ventamap}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ventamap-web:
    build:
      context: ./VentaMap.Web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ventamap-web
    restart: unless-stopped
    depends_on:
      ventamap-mysql:
        condition: service_healthy
    ports:
      - "${VENTAMAP_WEB_PORT:-7048}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ventamap-web.rule=Host(`ventamap.com.ar`) || Host(`www.ventamap.com.ar`)"
      - "traefik.http.routers.ventamap-web.entrypoints=websecure"
      - "traefik.http.routers.ventamap-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.ventamap-web.loadbalancer.server.port=8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      ConnectionStrings__DefaultConnection: server=ventamap-mysql;port=3306;database=${VENTAMAP_DATABASE_NAME:-ventamap};user=root;password=${MYSQL_ROOT_PASSWORD};
      DataProtection__KeysPath: /keys/dataprotection
      Authentication__CookieDomain: ${VENTAMAP_COOKIE_DOMAIN:-.ventamap.com.ar}
      Authentication__SharedApplicationName: VentaMap
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Use the current browser origin; Traefik routes /api/chat and /hubs/chat.
      Chat__BaseUrl: ""
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromEmail: ${SMTP_FROM_EMAIL}
      Email__ContactRecipient: ${SMTP_CONTACT_RECIPIENT:-${SMTP_FROM_EMAIL}}
      Email__FromName: ${SMTP_FROM_NAME:-VentaMap}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-25}
      Map__StyleUrl: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      Map__TilesUrlTemplate: ${MAP_TILES_URL_TEMPLATE:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      Map__AttributionHtml: ${MAP_ATTRIBUTION_HTML:-&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors}
      Map__GeocodingSearchUrlTemplate: ${MAP_GEOCODING_SEARCH_URL_TEMPLATE}
      Map__ReverseGeocodingUrlTemplate: ${MAP_REVERSE_GEOCODING_URL_TEMPLATE}
      Cloudflare__R2__AccountId: ${R2_ACCOUNT_ID}
      Cloudflare__R2__ServiceUrl: ${R2_SERVICE_URL}
      Cloudflare__R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      Cloudflare__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      Cloudflare__R2__Bucket: ${R2_BUCKET}
      Cloudflare__R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL}
      Cloudflare__R2__Prefix: ${R2_PREFIX:-publications}
      Cloudflare__R2__Region: ${R2_REGION:-auto}
      Cloudflare__R2__MaxImageSide: ${R2_MAX_IMAGE_SIDE:-1600}
      Cloudflare__R2__WebpQuality: ${R2_WEBP_QUALITY:-82}
      Cloudflare__R2__WatermarkScale: ${R2_WATERMARK_SCALE:-0.14}
      Cloudflare__R2__WatermarkOpacity: ${R2_WATERMARK_OPACITY:-0.45}
      Cloudflare__R2__MaxVideoBytes: ${R2_MAX_VIDEO_BYTES:-83886080}
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN}
      MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET}
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-false}
      Database__RunSeedDataOnStartup: ${DATABASE_RUN_SEED_DATA_ON_STARTUP:-false}
    volumes:
      - dataprotection_keys:/keys/dataprotection

  ventamap-chat:
    build:
      context: ./VentaMap.ChatService
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ventamap-chat
    restart: unless-stopped
    depends_on:
      ventamap-mysql:
        condition: service_healthy
    ports:
      - "${VENTAMAP_CHAT_PORT:-7065}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ventamap-chat.rule=(Host(`ventamap.com.ar`) || Host(`www.ventamap.com.ar`)) && (PathPrefix(`/api/chat`) || PathPrefix(`/hubs/chat`))"
      - "traefik.http.routers.ventamap-chat.entrypoints=websecure"
      - "traefik.http.routers.ventamap-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ventamap-chat.priority=100"
      - "traefik.http.services.ventamap-chat.loadbalancer.server.port=8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      ConnectionStrings__VentaMapConnection: server=ventamap-mysql;port=3306;database=${VENTAMAP_DATABASE_NAME:-ventamap};user=root;password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__ChatConnection: server=ventamap-mysql;port=3306;database=${VENTAMAP_CHAT_DATABASE_NAME:-ventamap_chat};user=root;password=${MYSQL_ROOT_PASSWORD};
      DataProtection__KeysPath: /keys/dataprotection
      Authentication__CookieDomain: ${VENTAMAP_COOKIE_DOMAIN:-.ventamap.com.ar}
      Authentication__CookieName: .VentaMap.Auth.v2
      Authentication__LoginPath: /Account/Login
      Authentication__LogoutPath: /Account/Logout
      Authentication__AccessDeniedPath: /Account/Login
      Authentication__SharedApplicationName: VentaMap
      Cors__AllowedOrigins__0: ${VENTAMAP_WEB_BASE_URL:-https://ventamap.com.ar}
      Cors__AllowedOrigins__1: ${VENTAMAP_WEB_BASE_URL_ALT:-}
      Chat__PublicBaseUrl: ${VENTAMAP_WEB_BASE_URL:-https://ventamap.com.ar}
      Chat__PublicationBaseUrl: ${VENTAMAP_WEB_BASE_URL:-https://ventamap.com.ar}
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromEmail: ${SMTP_FROM_EMAIL}
      Email__FromName: ${SMTP_FROM_NAME:-VentaMap}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-25}
    volumes:
      - dataprotection_keys:/keys/dataprotection

volumes:
  mysql_data:
    # During a stack-name migration, point this at the existing MySQL volume.
    # A new deployment uses the VentaMap-named default volume instead.
    name: ${MYSQL_DATA_VOLUME:-ventamap-local_mysql_data}
    external: ${MYSQL_DATA_VOLUME_EXTERNAL:-false}
  dataprotection_keys:
    # Keep authentication/data-protection keys stable across the migration.
    name: ${DATAPROTECTION_KEYS_VOLUME:-ventamap-local_dataprotection_keys}
    external: ${DATAPROTECTION_KEYS_VOLUME_EXTERNAL:-false}
